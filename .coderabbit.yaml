language: en-US

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!mobile/ios/**"
    - "!mobile/android/**"
    - "!**/node_modules/**"
    - "!**/*.lock"
    - "!**/package-lock.json"

chat:
  auto_reply: true
